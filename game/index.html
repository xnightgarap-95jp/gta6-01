<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Keys — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0c0e12; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  .hud { position: fixed; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); user-select: none; pointer-events: none; z-index: 5; }
  #topleft { top: 14px; left: 16px; }
  #stars { font-size: 26px; letter-spacing: 3px; }
  #cash { font-size: 24px; font-weight: 700; margin-top: 2px; }
  #health-wrap { width: 180px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid #ffffff88; border-radius: 6px; margin-top: 6px; }
  #health-fill { height: 100%; width: 100%; background: #3ddc5a; border-radius: 5px; }
  #health-text { font-size: 12px; margin-top: 2px; }
  #topright { top: 14px; right: 16px; text-align: right; }
  #clock { font-size: 22px; font-weight: 600; }
  #minimap { width: 168px; height: 168px; margin-top: 6px; border-radius: 50%; border: 2px solid #ffffff55; background: #20242a; }
  #objective { left: 50%; top: 14px; transform: translateX(-50%); text-align: center; font-size: 16px; max-width: 560px; }
  #objective-dist { display: block; font-size: 13px; color: #ffd23f; margin-top: 2px; }
  #bottomright { bottom: 16px; right: 20px; text-align: right; }
  #speed { font-size: 26px; font-weight: 700; }
  #ammo { font-size: 16px; margin-top: 2px; }
  #hint { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #ffffffcc; text-align: center; }
  #crosshair { left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; display: none; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
  #toast { left: 50%; top: 64px; transform: translateX(-50%); font-size: 17px; font-weight: 600; color: #ffd23f; opacity: 0; transition: opacity .3s; text-align: center; }
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(8, 10, 16, .55); z-index: 10; color: #fff; text-align: center; padding: 20px; }
  #menu-title { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ffd23f; text-shadow: 0 3px 0 #7a2e3d, 0 6px 18px rgba(0,0,0,.6); margin: 0; }
  #menu-text { font-size: 17px; max-width: 560px; line-height: 1.5; margin: 18px 0 26px; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  #menu-button { pointer-events: auto; cursor: pointer; font-size: 20px; font-weight: 700; padding: 14px 42px; border: none; border-radius: 8px; background: #ffd23f; color: #1a1a1a; }
  #menu-button:hover { background: #ffdf6b; }
  #paused { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="game"></div>
<div class="hud" id="topleft">
  <div id="stars">☆☆☆☆☆</div>
  <div id="cash">$0</div>
  <div id="health-wrap"><div id="health-fill"></div></div>
  <div id="health-text">100</div>
</div>
<div class="hud" id="topright">
  <div id="clock">08:00</div>
  <canvas id="minimap" width="168" height="168"></canvas>
</div>
<div class="hud" id="objective"><span id="objective-text"></span><span id="objective-dist"></span></div>
<div class="hud" id="bottomright">
  <div id="speed"></div>
  <div id="ammo">✊ fists</div>
</div>
<div class="hud" id="hint"></div>
<div class="hud" id="crosshair"></div>
<div class="hud" id="toast"></div>
<div id="menu">
  <h1 id="menu-title">CORAL KEYS</h1>
  <p id="menu-text"></p>
  <button id="menu-button">Start game</button>
</div>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
